<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veliafy</title>
    <meta
      name="description"
      content="Veliafy turns a raw business idea into a real path forward — planning, organization, and AI guidance in one workspace."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #450450;
        --accent: #ec8dec;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--white);
        font-family: Manrope, sans-serif;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.5rem 1.75rem;
      }

      .brand {
        font-family: "Dela Gothic One", sans-serif;
        font-size: 1.5rem;
        color: var(--accent);
        letter-spacing: 0.02em;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.75rem 4rem;
      }

      .hero {
        max-width: 36rem;
        text-align: center;
      }

      h1 {
        font-family: "Dela Gothic One", sans-serif;
        font-size: clamp(2.25rem, 6vw, 3.5rem);
        color: var(--accent);
        line-height: 1.15;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 2rem;
      }

      .cta {
        display: inline-block;
        background: var(--accent);
        color: var(--bg);
        font-family: "Dela Gothic One", sans-serif;
        font-size: 1rem;
        text-decoration: none;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        transition: opacity 0.15s ease;
      }

      .cta:hover {
        opacity: 0.88;
      }

      footer {
        padding: 1.25rem 1.75rem 1.75rem;
        text-align: center;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Veliafy</div>
    </header>
    <main>
      <section class="hero">
        <h1>From idea to real</h1>
        <p>
          Veliafy takes a raw business concept and gives it a clear path —
          planning, organization, and AI guidance in one connected workspace.
        </p>
        <a class="cta" href="mailto:hello@veliafy.com">Get in touch</a>
      </section>
    </main>
    <footer>&copy; 2026 Veliafy</footer>
  </body>
</html>
